name: khetmti
description: "Khetmti: share a khatma of the Quran with friends."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  percent_indicator: ^4.2.3
  intl: ^0.20.3
  shared_preferences: ^2.5.4
  smooth_page_indicator: ^1.2.0+3
  url_launcher: ^6.3.2
  supabase_flutter: ^2.6.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  # already pulled in by supabase_flutter; used directly by lib/main_screenshots.dart
  app_links: ^6.4.1

flutter_native_splash:
  image: "assets/images/Khetmti - App Logo.png"
  color: "#000000"
  android: true
  ios: true

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/Khetmti - App Logo.png"
  remove_alpha_ios: true

flutter:

  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/onboarding/
    - assets/data/

  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700

